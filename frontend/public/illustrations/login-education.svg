<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" role="img" aria-hidden="true">
  <!-- soft background blobs -->
  <ellipse cx="280" cy="250" rx="210" ry="170" fill="#E8F2FC"/>
  <circle cx="120" cy="110" r="54" fill="#D7E9FA"/>
  <circle cx="430" cy="90" r="36" fill="#DCEEF9"/>
  <circle cx="460" cy="340" r="48" fill="#E0F0FB"/>
  <circle cx="90" cy="360" r="28" fill="#D6E8F8"/>

  <!-- desk / platform -->
  <ellipse cx="280" cy="390" rx="180" ry="18" fill="#C9DEF2" opacity="0.7"/>

  <!-- monitor -->
  <rect x="210" y="168" width="170" height="118" rx="10" fill="#FFFFFF" stroke="#7BA3C9" stroke-width="3"/>
  <rect x="222" y="180" width="146" height="86" rx="4" fill="#EAF4FC"/>
  <!-- screen chart -->
  <path d="M240 245 L270 220 L295 235 L330 200 L355 215" stroke="#3B82C4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="270" cy="220" r="4" fill="#1E3A5F"/>
  <circle cx="330" cy="200" r="4" fill="#1E3A5F"/>
  <rect x="268" y="286" width="54" height="10" rx="2" fill="#9BB8D4"/>
  <rect x="248" y="296" width="94" height="8" rx="2" fill="#B7CDE3"/>

  <!-- books stack left -->
  <g transform="translate(118,300)">
    <rect x="0" y="28" width="88" height="16" rx="2" fill="#5B8FC7" transform="rotate(-6 44 36)"/>
    <rect x="4" y="14" width="88" height="16" rx="2" fill="#3D6FA8" transform="rotate(-3 48 22)"/>
    <rect x="8" y="0" width="88" height="16" rx="2" fill="#F4A261"/>
  </g>

  <!-- graduation cap on books -->
  <g transform="translate(145,250)">
    <path d="M40 28 L80 12 L120 28 L80 44 Z" fill="#1E3A5F"/>
    <path d="M52 32 V48 c0 8 12 12 28 12 s28-4 28-12 V32" fill="#2A4A73"/>
    <path d="M120 28 V42" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="46" r="5" fill="#E11D48"/>
    <path d="M120 46 C128 52 124 60 118 58" stroke="#E11D48" stroke-width="2" fill="none"/>
  </g>

  <!-- student figure left (simple) -->
  <g transform="translate(70,250)">
    <circle cx="36" cy="28" r="16" fill="#F2C4A0"/>
    <path d="M20 22c4-10 28-10 32 0" fill="#1E3A5F"/>
    <path d="M12 52c4-18 44-18 48 0v48H12V52Z" fill="#3B82C4"/>
    <rect x="28" y="70" width="16" height="22" rx="2" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- student figure right -->
  <g transform="translate(400,255)">
    <circle cx="36" cy="28" r="16" fill="#E8B894"/>
    <path d="M18 24c6-12 30-12 36 2" fill="#334155"/>
    <path d="M10 54c6-18 46-18 52 0v46H10V54Z" fill="#0EA5A4"/>
    <rect x="26" y="72" width="20" height="18" rx="2" fill="#ECFDF5"/>
  </g>

  <!-- floating elements -->
  <g transform="translate(420,150)">
    <rect width="44" height="52" rx="4" fill="#FFFFFF" stroke="#8FB4D6" stroke-width="2"/>
    <path d="M12 16h20M12 26h16M12 36h18" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(90,150)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#8FB4D6" stroke-width="2"/>
    <path d="M18 8v20M8 18h20" stroke="#3B82C4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- plant accent -->
  <g transform="translate(360,310)">
    <rect x="18" y="40" width="28" height="22" rx="3" fill="#94A3B8"/>
    <path d="M32 40 C20 20 8 28 18 40" fill="#34D399"/>
    <path d="M32 40 C44 18 58 28 46 40" fill="#10B981"/>
    <path d="M32 40 C28 12 40 8 36 28" fill="#059669"/>
  </g>
</svg>
